<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geopolitics Game</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="top-bar">
      <h1>Geopolitics Game</h1>
      <p id="game-status">
        Select a country to attack from and an enemy target
      </p>
    </header>

    <div id="game-container">
      <!-- Country cards -->
      <div id="board"></div>

      <!-- World map background-->
      <div class="world-map-container" id="world-map-svg">
        <img
          src="/static/images/world_map.svg"
          alt="World Map"
          class="tactical-map-img"
        />
      </div>

      <div id="right-panel">
        <!-- Panel for selctions and buttons -->
        <div id="controls">
          <p>
            <strong>Attacker:</strong> <span id="selected-attacker">None</span>
            <strong>Defender:</strong> <span id="selected-defender">None</span>
          </p>

          <button id="attack-btn">Attack</button>
          <button id="end-turn-btn">End Turn</button>
          <button id="reset-btn">Reset Game</button>
        </div>

        <!-- Dice rolls and battle outcomes -->
        <div id="battle-log">
          <p>
            Awaiting orders. Select an attacker and a defender to launch an
            attack.
          </p>
        </div>
      </div>
    </div>

    <script src="/static/js/game.js"></script>
  </body>
</html>
