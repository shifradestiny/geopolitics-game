<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geopolitics Game - Login</title>
    <link rel="stylesheet" href="/static/css/login_style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h2>Geopolitics Game - Login</h2>
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      message %} {% for category, message in messages %}
      <div class="flash-message" {{ category}}>{{ message}}</div>
      {% endfor %} {% endif %} {% endwith %}
      <form action="/login" method="POST">
        <input
          type="text"
          name="username"
          placeholder="Username"
          required
        /><br />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        /><br />
        <button type="submit">Login</button>
      </form>
      <p>Don't have an account? <a href="register">Reigster one here!</a></p>
    </div>
  </body>
</html>
